# Sirve el build estático de la SPA. El enrutamiento de /api/* al backend lo
# hace Caddy (deploy/Caddyfile), no nginx — este contenedor solo entrega
# archivos estáticos con fallback a index.html para las rutas del cliente
# (react-router).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre (Vite) pueden cachearse agresivamente.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
