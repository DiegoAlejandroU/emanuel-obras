# Integración continua (CI): se ejecuta en cada push a develop o a una rama
# feature/fix y en cada pull request. Si algo falla, el cambio no debería
# llegar a produccion. El pipeline de CD (cd.yml) lo reutiliza completo antes
# de desplegar.
name: CI

on:
  push:
    branches: [develop, "feature/**", "fix/**"]
  pull_request:
    branches: [develop, produccion]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, seguridad y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # PostgreSQL real (el mismo motor de producción), no SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: emanuel_obras_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d emanuel_obras_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/emanuel_obras_test
      SECRET_KEY: clave-solo-para-el-ci-no-es-un-secreto
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      ALLOWED_ORIGIN: http://localhost:5173
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app scripts tests

      - name: Análisis de seguridad del código (bandit)
        run: bandit -q -r app

      - name: Migraciones de Alembic (subir, bajar y volver a subir)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Pruebas automáticas (pytest)
        run: python -m pytest -q --junitxml=reports/pytest.xml

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pytest
          path: backend/reports/pytest.xml
          if-no-files-found: ignore

  dependencias:
    name: Backend · auditoría de dependencias
    runs-on: ubuntu-latest
    # Bloqueante: si alguna librería de la app tiene una vulnerabilidad
    # conocida, el pipeline falla y no se despliega hasta actualizarla.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r backend/requirements.txt

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

  docker:
    name: Docker · build y prueba de humo
    runs-on: ubuntu-latest
    needs: [backend, dependencias, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose
        run: |
          docker compose config --quiet
          cp deploy/.env.example deploy/.env
          cp backend/.env.prod.example backend/.env.prod
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Construir imágenes
        run: docker compose build

      - name: Levantar el sistema (espera a que los healthchecks estén en verde)
        run: docker compose up -d --wait --wait-timeout 180

      - name: Prueba de humo
        run: bash .github/scripts/prueba_humo_local.sh

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar
        if: always()
        run: docker compose down -v
