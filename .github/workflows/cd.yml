# Despliegue continuo (CD): se ejecuta con cada push a la rama produccion.
#
#   1. CI completo (ci.yml): lint, seguridad, pruebas, build y prueba de humo.
#   2. Publica las imágenes Docker en GitHub Container Registry (ghcr.io).
#   3. Dispara el redeploy del backend en Render (deploy hook).
#   4. Espera a que la API en vivo sirva este commit y hace una prueba de humo.
#
# El frontend lo sigue desplegando Vercel solo al recibir el push.
#
# Configuración (una vez, en GitHub > Settings):
#   - Secret RENDER_DEPLOY_HOOK_URL: el "Deploy Hook" del servicio en Render.
#   - Opcionales (Variables): API_URL y WEB_URL si cambian las URLs públicas.
name: CD

on:
  push:
    branches: [produccion]
  workflow_dispatch:

# Un despliegue a la vez; uno nuevo espera a que termine el anterior.
concurrency:
  group: cd-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publicar:
    name: Publicar imagen · ${{ matrix.servicio }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servicio: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # ghcr.io exige el nombre de la imagen en minúsculas.
      - name: Nombre de la imagen
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.servicio }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=produccion
            type=raw,value=latest

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servicio }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  desplegar:
    name: Desplegar en Render y verificar
    needs: publicar
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ vars.WEB_URL || 'https://emanuel-obras.vercel.app' }}
    env:
      API_URL: ${{ vars.API_URL || 'https://emanuel-obras.onrender.com' }}
      WEB_URL: ${{ vars.WEB_URL || 'https://emanuel-obras.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Disparar el deploy del backend en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta el secret RENDER_DEPLOY_HOOK_URL (GitHub > Settings > Secrets and variables > Actions). Ver README, sección CI/CD."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy solicitado a Render."

      - name: Esperar la versión nueva y prueba de humo
        env:
          VERSION_ESPERADA: ${{ github.sha }}
        run: bash .github/scripts/esperar_despliegue.sh
